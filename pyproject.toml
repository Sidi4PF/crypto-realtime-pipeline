[project]
name = "crypto-realtime-pipeline"
version = "0.1.0"
description = "Real-time crypto trade pipeline: Binance websocket to Redpanda to Spark to S3"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13,<16",
    "confluent-kafka>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]
orchestration = [
    "dagster>=1.9,<1.12",
    "dagster-webserver>=1.9,<1.12",
    "dagster-duckdb>=0.25",
    "duckdb>=1.1",
    "boto3>=1.35",
    "requests>=2.32",
    "pyarrow>=17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]