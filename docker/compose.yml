name: crypto-realtime-pipeline

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    profiles: ["ingest", "compute", "serve"]
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    profiles: ["ingest", "compute", "serve"]
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  spark:
    image: apache/spark:3.5.3
    container_name: spark
    profiles: ["compute"]
    user: root
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/app/src
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RAW_TRADES_TOPIC: trades.raw
      WATERMARK: 10 seconds
      WINDOW_DURATION: 1 minute
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: crypto-lake
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ../src:/opt/app/src
      - ../tests:/opt/app/tests
      - ../checkpoints:/opt/app/checkpoints
      - ivy-cache:/root/.ivy2
    working_dir: /opt/app
    command: >
      /opt/spark/bin/spark-submit
      --master local[3]
      --driver-memory 3g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      --conf spark.sql.shuffle.partitions=3
      --conf spark.sql.session.timeZone=UTC
      src/spark_jobs/streaming_job.py

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    profiles: ["compute", "serve", "orchestrate"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data
      - mc-config:/root/.mc

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: minio-init
    profiles: ["compute", "serve", "orchestrate"]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - mc-config:/root/.mc
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/crypto-lake;
      echo bucket ready;
      "

  dagster:
    image: python:3.11-slim
    container_name: dagster
    profiles: ["orchestrate"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/app/src
      DAGSTER_HOME: /opt/app/dagster_home
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: crypto-lake
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: eu-west-3
    ports:
      - "3000:3000"
    volumes:
      - ../src:/opt/app/src
      - ../pyproject.toml:/opt/app/pyproject.toml
      - dagster-home:/opt/app/dagster_home
      - dagster-build:/opt/app/src/crypto_realtime_pipeline.egg-info
    working_dir: /opt/app
    command: >
      sh -c "
      pip install -q -e '.[orchestration]' &&
      dagster dev -m orchestration.definitions -h 0.0.0.0 -p 3000
      "

volumes:
  redpanda-data:
  ivy-cache:
  minio-data:
  dagster-home:
  dagster-build:
  mc-config:
